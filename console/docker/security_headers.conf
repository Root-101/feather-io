# Included by nginx.conf in the server and in every location with its own add_header.
# script-src: only the build's scripts (no inline ones, see web/splash.js), and WebAssembly for
# CanvasKit. Also applies to the objects the console opens as blob: URLs. The rest (connect,
# images, fonts) stays open: the service's URL is only known when the container starts.
add_header Content-Security-Policy "script-src 'self' 'wasm-unsafe-eval'; base-uri 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
