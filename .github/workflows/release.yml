# A version tag (v1.1.0, v1.2.0-rc.1) publishes both images on ghcr.io, for amd64 and arm64, once
# the CI passes: ghcr.io/root-101/feather-io and ghcr.io/root-101/feather-io-console, tagged with
# the version without the `v`. `latest` only moves with a version without `-rc`.
name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  image:
    name: Image ${{ matrix.image }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: feather-io
            context: service
          - image: feather-io-console
            context: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter console/.fvmrc)" >> "$GITHUB_OUTPUT"

      # arm64 through QEMU: slow, but only the service is compiled per arch (the console builds
      # its web files once, on the runner's platform)
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/root-101/${{ matrix.image }}
          tags: type=semver,pattern={{version}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          # Only the console's Dockerfile reads it
          build-args: FLUTTER_VERSION=${{ steps.fvm.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
