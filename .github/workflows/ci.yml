# Analysis and tests of both packages, and the AWS CLI and rclone batteries against the Docker
# image of the service (service/tool/s3_compat/run.sh). Mint stays manual (~5 min, see CLAUDE.md).
name: CI

# Only the main branches and the pull requests into them; a work branch can run it by hand
# (Actions > CI > Run workflow)
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: Service (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - run: dart pub get --enforce-lockfile
      - run: dart analyze
      - run: dart test

  console:
    name: Console (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # The deprecated MaterialUiCompatibilityBridge is an info we keep on purpose
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  console-image:
    name: Console image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image with the Flutter of .fvmrc
        run: |
          docker build -t feather-io-console \
            --build-arg FLUTTER_VERSION="$(jq -r .flutter console/.fvmrc)" console
      - name: Serve it with the env.js of the container
        run: |
          docker run -d --name console -p 8081:80 -e SERVICE_URL=http://service.test feather-io-console
          for _ in $(seq 15); do curl -sf http://localhost:8081/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8081/ | grep -q flutter_bootstrap.js
          curl -sf http://localhost:8081/env.js | grep -q '"http://service.test"'
          # The CSP and the security headers, also on index.html (a location with its own add_header)
          curl -sfI http://localhost:8081/ | grep -qi "^content-security-policy: script-src 'self'"
          curl -sfI http://localhost:8081/main.dart.js | grep -qi '^x-content-type-options: nosniff'

  s3-compat:
    name: S3 clients (AWS CLI + rclone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -t feather-io service
      - name: Start the service
        run: |
          docker run -d --name feather-io -p 8080:8080 \
            -e FEATHER_ACCESS=feather-access -e FEATHER_SECRET=feather-secret-key \
            -e JWT_SECRET=ci-jwt-secret -e KEYS_ENCRYPTION_SECRET=ci-keys-secret \
            feather-io
          for _ in $(seq 30); do
            curl -sf http://localhost:8080/_admin/health > /dev/null && exit 0
            sleep 1
          done
          docker logs feather-io
          exit 1
      - name: Run the batteries
        run: |
          # The clients run in other containers: they reach the service through the bridge gateway
          gateway=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          ENDPOINT="http://$gateway:8080" bash service/tool/s3_compat/run.sh awscli rclone
      # Clients retry, so a 500 may only show up in the service log
      - name: No unhandled errors in the service log
        if: always()
        run: |
          docker logs feather-io > service.log 2>&1
          count=$(grep -c 'Unhandled error' service.log || true)
          echo "Unhandled errors: $count"
          [ "$count" -eq 0 ] || { grep -B2 -A20 'Unhandled error' service.log; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: s3-compat
          path: |
            service/tool/s3_compat/out/
            service.log
